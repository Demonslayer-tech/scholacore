<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScholaCore — Student Sign Up</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="sc-header">
    <span class="sc-header__title">ScholaCore</span>
  </header>

  <main>
    <div class="sc-card">
      <h1 style="margin:0 0 4px;font-size:1.4rem;color:#0F52BA;">Student Account</h1>
      <p style="margin:0;color:#475569;font-size:0.9rem;">Sign up or log in to access your classes.</p>

      <div id="signup-tab">
        <form id="signup-form">
          <label class="sc-label" for="fullName">Full Name</label>
          <input class="sc-input" id="fullName" type="text" required />

          <label class="sc-label" for="gradeLevel">Grade Level</label>
          <select class="sc-select" id="gradeLevel" required>
            <option value="">Select grade</option>
            <option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
            <option>SSS 1</option><option>SSS 2</option><option>SSS 3</option>
          </select>

          <label class="sc-label" for="email">Email</label>
          <input class="sc-input" id="email" type="email" required />

          <label class="sc-label" for="password">Password</label>
          <input class="sc-input" id="password" type="password" minlength="8" required />

          <button class="sc-btn" type="submit">Create Account</button>
        </form>
      </div>

      <div id="alert" class="sc-alert"></div>

      <p style="text-align:center;margin-top:16px;font-size:0.85rem;">
        Already have an account? <a href="#" id="show-login" style="color:#0F52BA;">Log in</a>
      </p>

      <form id="login-form" style="display:none;">
        <label class="sc-label" for="loginEmail">Email</label>
        <input class="sc-input" id="loginEmail" type="email" required />
        <label class="sc-label" for="loginPassword">Password</label>
        <input class="sc-input" id="loginPassword" type="password" required />
        <button class="sc-btn" type="submit">Log In</button>
      </form>
    </div>
  </main>

  <footer class="sc-footer">
    <a href="/privacy-policy.html">Privacy Policy</a> &nbsp;·&nbsp; <a href="/terms-of-service.html">Terms of Service</a>
  </footer>

  <script src="/js/firebase-config.js"></script>
  <script>
    const tgData = initTelegramWebApp();
    const alertEl = document.getElementById("alert");

    document.getElementById("show-login").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("signup-tab").style.display = "none";
      document.getElementById("login-form").style.display = "block";
    });

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("fullName").value.trim();
      const gradeLevel = document.getElementById("gradeLevel").value;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection("users").doc(cred.user.uid).set({
          fullName,
          email,
          role: "student",
          gradeLevel,
          paymentStatus: "unpaid",
          telegramUserId: tgData && tgData.user ? String(tgData.user.id) : null,
          aiQueryCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showAlert(alertEl, "Account created. Redirecting…", "success");
        window.location.href = "/pay.html";
      } catch (err) {
        showAlert(alertEl, err.message, "error");
      }
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = "/pay.html";
      } catch (err) {
        showAlert(alertEl, err.message, "error");
      }
    });
  </script>
</body>
</html>
