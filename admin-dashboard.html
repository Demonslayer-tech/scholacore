<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholaCore: Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="sc-header">
    <span class="sc-header__title">ScholaCore: Admin</span>
  </header>

  <main>
    <div class="sc-card" id="login-card">
      <h1 class="text-lg font-bold" style="color:#0F52BA;">Admin Login</h1>
      <form id="login-form">
        <label class="sc-label" for="email">Email</label>
        <input class="sc-input" id="email" type="email" required />
        <label class="sc-label" for="password">Password</label>
        <input class="sc-input" id="password" type="password" required />
        <button class="sc-btn" type="submit">Log In</button>
      </form>
      <div id="login-alert" class="sc-alert"></div>
    </div>

    <div class="sc-card sc-card--wide hidden" id="dashboard-card">
      <h2 class="text-lg font-bold" style="color:#0F52BA;">Pending Teacher Applications</h2>
      <p class="text-slate-600 text-sm">Review credentials and approve or reject each applicant.</p>

      <table class="sc-table">
        <thead>
          <tr><th>Name</th><th>Subjects</th><th>Credentials</th><th>Documents</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="applications-body"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>

  <footer class="sc-footer">
    <a href="/privacy-policy.html">Privacy Policy</a> ·
    <a href="/terms-of-service.html">Terms of Service</a>
  </footer>

  <script type="module" src="/assets/js/pages/admin-dashboard.js"></script>
</body>
</html>
