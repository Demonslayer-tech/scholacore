<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholaCore: Student Sign Up</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/images/scholacore-emblem.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="sc-header">
    <img src="/assets/images/scholacore-wordmark.png" alt="ScholaCore" class="sc-header__logo" />
  </header>

  <main>
    <div class="sc-card" id="signup-card">
      <div class="sc-logo-header">
        <img src="/assets/images/scholacore-emblem.png" alt="ScholaCore" class="sc-emblem" />
      </div>
      <h1 class="sc-display" style="text-align:center;font-size:1.4rem;">Create Your Student Account</h1>
      <p style="text-align:center;font-size:0.88rem;">Takes about a minute.</p>

      <form id="signup-form">
        <label class="sc-label" for="fullName">Full Name</label>
        <input class="sc-input" id="fullName" type="text" autocomplete="name" required />

        <label class="sc-label" for="gradeLevel">Grade Level</label>
        <select class="sc-select" id="gradeLevel" required>
          <option value="">Select grade</option>
          <option>JSS 1</option><option>JSS 2</option><option>JSS 3</option>
          <option>SSS 1</option><option>SSS 2</option><option>SSS 3</option>
        </select>

        <label class="sc-label" for="email">Email</label>
        <input class="sc-input" id="email" type="email" autocomplete="email" required />

        <label class="sc-label" for="phone">Phone Number</label>
        <input class="sc-input" id="phone" type="tel" autocomplete="tel" placeholder="080..." required />

        <label class="sc-label" for="password">Password</label>
        <input class="sc-input" id="password" type="password" autocomplete="new-password" minlength="8" required />
        <span class="sc-hint">At least 8 characters.</span>

        <label class="sc-label" for="confirmPassword">Confirm Password</label>
        <input class="sc-input" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />

        <button class="sc-btn" type="submit" id="submit-btn">Create Account</button>
      </form>

      <div id="alert" class="sc-alert"></div>

      <p class="text-center mt-4 text-sm">
        Already have an account? <a href="/student-login.html" style="color:#ffffff;text-decoration:underline;">Log in</a>
      </p>
    </div>

    <!-- Shown in place of the form once the account is created. -->
    <div class="sc-card hidden" id="verify-card">
      <div class="sc-logo-header">
        <img src="/assets/images/scholacore-emblem.png" alt="ScholaCore" class="sc-emblem" />
      </div>
      <h1 class="sc-display" style="text-align:center;font-size:1.3rem;">Check your email</h1>
      <p style="text-align:center;">
        We sent a verification link to <strong id="verify-email"></strong>.
        Click it, then log in below.
      </p>
      <a class="sc-btn" href="/student-login.html">Go to Log In</a>
      <button class="sc-btn sc-btn--secondary" type="button" id="resend-btn" style="margin-top:10px;">Resend Email</button>
      <div id="verify-alert" class="sc-alert"></div>
    </div>
  </main>

  <footer class="sc-footer">
    <a href="/privacy-policy.html">Privacy Policy</a> ·
    <a href="/terms-of-service.html">Terms of Service</a>
  </footer>

  <script type="module" src="/assets/js/pages/student-signup.js"></script>
</body>
</html>
