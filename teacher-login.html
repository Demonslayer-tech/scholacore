<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholaCore: Teacher Log In</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/images/scholacore-emblem.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="sc-header">
    <img src="/assets/images/scholacore-wordmark.png" alt="ScholaCore" class="sc-header__logo" />
    <span class="sc-header__title" style="margin-left:0.6rem;font-size:1rem;">Teacher</span>
  </header>

  <main>
    <div class="sc-card">
      <div class="sc-logo-header">
        <img src="/assets/images/scholacore-emblem.png" alt="ScholaCore" class="sc-emblem" />
      </div>
      <h1 class="sc-display" style="text-align:center;font-size:1.3rem;">Teacher Log In</h1>
      <form id="login-form">
        <label class="sc-label" for="email">Email</label>
        <input class="sc-input" id="email" type="email" autocomplete="email" required />
        <label class="sc-label" for="password">Password</label>
        <input class="sc-input" id="password" type="password" autocomplete="current-password" required />
        <button class="sc-btn" type="submit" id="submit-btn">Log In</button>
      </form>
      <div id="alert" class="sc-alert"></div>

      <p class="text-center mt-4 text-sm">
        Haven't applied yet? <a href="/teacher-signup.html" style="color:#ffffff;text-decoration:underline;">Apply to teach</a>
      </p>
    </div>
  </main>

  <footer class="sc-footer">
    <a href="/privacy-policy.html">Privacy Policy</a> ·
    <a href="/terms-of-service.html">Terms of Service</a>
  </footer>

  <script type="module" src="/assets/js/pages/teacher-login.js"></script>
</body>
</html>
