<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholaCore</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/images/scholacore-emblem.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="sc-header">
    <img src="/assets/images/scholacore-wordmark.png" alt="ScholaCore" class="sc-header__logo" />
  </header>

  <main>
    <div class="sc-card sc-card--wide">
      <div class="sc-logo-header">
        <img src="/assets/images/scholacore-emblem.png" alt="ScholaCore" class="sc-emblem" />
      </div>
      <h1 class="sc-display" style="text-align:center;">Welcome to ScholaCore</h1>
      <p style="text-align:center;margin-bottom:8px;">Choose where you'd like to go.</p>

      <div class="sc-role-grid">
        <a href="/student-signup.html" class="sc-role-tile">
          <svg class="sc-role-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.8V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.2"/></svg>
          <span class="sc-role-tile__name">Student Sign Up</span>
          <span class="sc-role-tile__desc">New here? Create your account.</span>
        </a>
        <a href="/student-login.html" class="sc-role-tile">
          <svg class="sc-role-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          <span class="sc-role-tile__name">Student Log In</span>
          <span class="sc-role-tile__desc">Already have an account? Sign in.</span>
        </a>
        <a href="/teacher-signup.html" class="sc-role-tile">
          <svg class="sc-role-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20V10"/><path d="m4 6 8-4 8 4-8 4-8-4Z"/><path d="M4 6v8l8 4 8-4V6"/></svg>
          <span class="sc-role-tile__name">Apply to Teach</span>
          <span class="sc-role-tile__desc">Submit your credentials for screening.</span>
        </a>
        <a href="/teacher-login.html" class="sc-role-tile">
          <svg class="sc-role-tile__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/></svg>
          <span class="sc-role-tile__name">Teacher Log In</span>
          <span class="sc-role-tile__desc">Already approved? Sign in to your classes.</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="sc-footer">
    <a href="/privacy-policy.html">Privacy Policy</a> ·
    <a href="/terms-of-service.html">Terms of Service</a>
  </footer>

  <script type="module" src="/assets/js/telegram.js"></script>
  <script type="module">
    import { initTelegramWebApp } from '/assets/js/telegram.js';
    initTelegramWebApp();
  </script>
</body>
</html>
