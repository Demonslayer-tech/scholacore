<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScholaCore: Pay Tuition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/images/scholacore-emblem.png" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="sc-header">
    <img src="/assets/images/scholacore-wordmark.png" alt="ScholaCore" class="sc-header__logo" />
  </header>

  <main>
    <div class="sc-card" id="pay-card">
      <h1 class="text-xl font-bold" style="color:#ffffff;">Tuition / Bursary Payment</h1>
      <p class="text-slate-200 text-sm">Complete your payment to receive your class group invite automatically.</p>

      <label class="sc-label" for="amount">Amount (Naira)</label>
      <input class="sc-input" id="amount" type="number" min="500" step="1" value="5000" required />

      <button class="sc-btn" id="pay-btn">Pay with Paystack</button>
      <div id="alert" class="sc-alert"></div>
    </div>

    <div class="sc-card hidden" id="login-required-card">
      <p class="text-slate-200">Please <a href="/student-signup.html" style="color:#ffffff;text-decoration:underline;">sign in</a> before making a payment.</p>
    </div>
  </main>

  <footer class="sc-footer">
    <a href="/privacy-policy.html">Privacy Policy</a> ·
    <a href="/terms-of-service.html">Terms of Service</a>
  </footer>

  <script type="module" src="/assets/js/pages/pay.js"></script>
</body>
</html>
